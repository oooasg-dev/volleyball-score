<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Stats-Pult v0.1</title>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
<style>
:root{
 --c:60px;      /* кружок игрока на поле */
 --b:32px;      /* кружок игрока на скамейке */
 --btn:40px;    /* высота кнопок Angriff/Block/Ass/Fehler/OK */
 --btn-fs:13px; /* шрифт на кнопках */
 --nm:13px;     /* фамилия под кружком */
 --gap:10px;    /* добавочный воздух в поле команды */
}
body{font-family:-apple-system,"Segoe UI",sans-serif;background:#f0f0f0;margin:0;padding:6px;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.w{max-width:372px;margin:0 auto}
.top{background:#2e7d32;color:#fff;border-radius:12px;padding:6px 8px;display:flex;align-items:center;gap:6px;font-weight:bold;height:60px;box-sizing:border-box}
.top .sc{flex:1;text-align:center;font-size:46px;line-height:1;letter-spacing:1px}
.top .ss{width:22px;text-align:center;font-size:15px;font-weight:600;opacity:.9}
.top button.hold{background:#e53935;transition:background 1.2s linear}
.top button{-webkit-touch-callout:none;background:#ffffff33;color:#fff;border:0;border-radius:10px;width:38px;height:38px;font-size:19px;padding:0}
.blk{position:relative;background:#f8fff6;border:2px solid #a8cfa3;border-radius:15px;padding:7px;margin:5px 0}
.hd{display:flex;justify-content:space-between;align-items:baseline;padding:0 8px calc(2px + var(--gap));font-weight:800;font-size:22px;line-height:1.15}
.hd span:last-child{font-size:14px;font-weight:700;color:#000}
.rows{display:flex;flex-direction:column;gap:calc(5px + var(--gap));background:#b1bdc5;border-radius:10px;padding:6px 4px calc(7px + var(--gap))}
.row{display:flex;justify-content:space-around;align-items:flex-start}
.pw{width:calc(var(--c) + 24px);text-align:center}
.p{width:var(--c);height:var(--c);border-radius:50%;border:4px solid transparent;box-sizing:border-box;color:#fff;font-weight:bold;font-size:calc(var(--c)*.46);display:flex;align-items:center;justify-content:center;margin:0 auto;position:relative}
.p.srv{border-color:#ffeb3b}
.p.sel{transform:scale(1.15);box-shadow:0 0 0 3px #fff,0 0 0 6px #263238}
.nm{margin-top:3px;font-size:var(--nm);line-height:1.15;font-weight:700;color:#1c1c1c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bench{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:7px;min-height:36px}
.bench .p{width:var(--b);height:var(--b);font-size:calc(var(--b)*.47);margin:0;opacity:.9}
.bench .nm{margin:0}
.act{display:flex;gap:4px;margin-top:7px}
.act button{flex:1;min-width:0;padding:0;height:var(--btn);border:0;border-radius:9px;background:#546e7a;color:#fff;font-weight:bold;font-size:var(--btn-fs)}
.act button.on{background:#ff9800;color:#000}.act .ok{background:#2e7d32;flex:.9}.act .ok:disabled{background:#90a4ae}
.sub{display:flex;gap:4px;margin-top:7px;min-height:36px}.sub button{flex:1;height:36px;padding:0;border:0;border-radius:8px;background:#cfd8dc;font-size:14px;font-weight:700}.sub button.on{background:#ff9800}
.net{display:none}
.toast{position:absolute;left:12px;right:12px;top:8px;z-index:5;background:#1b5e20;color:#fff;border-radius:10px;padding:7px 10px;font-weight:bold;font-size:16px;text-align:center;animation:fade 1.6s forwards}
@keyframes fade{0%,70%{opacity:1}100%{opacity:0}}
.p.ok{animation:okp .7s;box-shadow:0 0 0 5px #4caf50,0 0 14px 6px #4caf5099}
@keyframes okp{0%{transform:scale(1.4)}100%{transform:scale(1)}}
.log{font-size:14px;font-weight:600;color:#37474f;text-align:center;min-height:18px;padding-bottom:2px}

</style></head><body><div class="w">
<div class="top"><button onclick="swap()">⇅</button>
<div class="ss" id="s1">0</div><div class="sc" id="pts">0:0</div><div class="ss" id="s2">0</div>
<button id="undo" title="Тап: отмена · удержать: сброс всего">↩︎</button></div>
<div id="app"></div><div class="log" id="log"></div>
</div>
<script>
const VS="https://volley-stats-14e43-default-rtdb.firebaseio.com";
const COL={1:"#1976d2",2:"#c62828"},TXT={1:"#0d47a1",2:"#b71c1c"};
let L={lineup:{},bench:{},libero:{},serving:null,names:{},uuid:null};
let flash=null,ft=null;let events=[],sel={1:{},2:{}},topTeam=1;
const SK={atk:"Angriff",blk:"Block",ace:"Ass",err:"Fehler",rec:"Annahme"},ERR={serve:"Aufschl.",atk:"Angriff",other:"Sonst."};

// Annahme: Bewertung wie Data Volley. Gewichte für den Index (Ind) – hier ändern:
const GR=["#","+","!","-","/","="],REC_W={"=":-8,"/":-7,"-":-1,"!":0,"+":8,"#":10};   // веса приёма (свои)
// Подача оценивается по приёму соперника: приём → оценка подачи; веса индекса подачи (свои). Ошибка на подаче = "="
const SV_MAP={"=":"#","/":"/","-":"+","!":"!","+":"-","#":"-"},SV_W={"#":10,"/":8,"+":7,"-":0,"!":4,"=":-10};   // "=" = ошибка на подаче
const evTxt=e=>e.skill==="rec"?`Annahme (${e.grade})`:`${SK[e.skill]}${e.err?" ("+ERR[e.err]+")":""}`;

// ---------- DVV (nur Aufstellung) ----------
const app=firebase.initializeApp({databaseURL:"https://sams-score-3liga-default-rtdb.europe-west1.firebasedatabase.app"},"sams");
const db=firebase.database(app);
function listen(p,f){db.ref(p).on("value",s=>{f(s.val());render();pushVmix()})}
listen("program/live/live/lineup",v=>L.lineup=v||{});
listen("program/live/live/bench",v=>L.bench=v||{});
listen("program/live/roster",v=>L.roster=v||{});
listen("program/live/live/libero",v=>L.libero=v||{});
listen("program/live/live/servingPlayer",v=>{L.serving=v;scSched()});
listen("program/live/live/currentSetScore",v=>{L.score=v;L.scoreSeen=true;scSched()});
listen("program/live/live/setNumber",v=>{L.setNo=v;scSched()});
listen("program/live/live/servingTeam",v=>{L.servingTeam=v;scSched()});
listen("program/live/meta/team1Name",v=>L.names[1]=v||"Team 1");
listen("program/live/meta/team2Name",v=>L.names[2]=v||"Team 2");
const vdb=firebase.database(firebase.initializeApp({databaseURL:VS},"vs"));
let jref=null,keys=[];
db.ref("program/matchUuid").on("value",s=>{
  L.uuid=s.val();if(jref){jref.off();jref=null}
  if(sref){sref.off();sref=null}
  events=[];keys=[];serves={};SC=null;SCH={};
  if(L.uuid){sref=vdb.ref(`stats_journal/${L.uuid}/serves`);sref.on("value",sn=>{serves=sn.val()||{};render();pushVmix()})}
  if(!L.uuid){render();return}
  jref=vdb.ref(`stats_journal/${L.uuid}/events`);
  jref.on("value",sn=>{events=[];keys=[];sn.forEach(c=>{events.push(c.val());keys.push(c.key)});render();pushVmix()});
});

// ---------- Aufschläge aus dem DVV-Spielstand ----------
// Jeder Punkt = ein Aufschlag des Spielers, der VOR dem Punkt aufschlug. Ablage: stats_journal/<match>/serves/<satz>_<punkte>
// SCH merkt sich pro Punktestand, wer da aufschlug -> bleibt richtig, wenn der Tisch Punkte zurücknimmt oder ändert.
let SC=null,SCH={},sct=null,serves={},sref=null;
function scSched(){clearTimeout(sct);sct=setTimeout(scEval,400)}   // kurz warten, bis Spielstand und Aufschläger beide da sind
function scEval(){
  if(!L.uuid||!sref||!L.scoreSeen||L.setNo==null||!L.serving)return;
  const cs=L.score||{},a=Number(cs.team1)||0,b=Number(cs.team2)||0,tot=a+b,set=L.setNo,
    st={p:L.serving,team:L.servingTeam==="team2"?2:1};
  const drop=n=>Object.keys(serves).forEach(k=>{const x=serves[k];if(x&&x.set===set&&x.n>n)sref.child(k).remove()});
  const put=n=>{const h=SCH[n-1],k=set+"_"+n;
    if(!h||!h.p||!h.p.uuid){sref.child(k).remove();return}
    sref.child(k).set({set:set,n:n,team:h.team,pl:h.p.uuid,num:h.p.num||null,name:h.p.name||null})};
  if(!SC||SC.set!==set){SCH={};drop(tot)}                              // Start / Satzwechsel: Reste über dem Stand löschen
  else if(tot<SC.t){drop(tot);Object.keys(SCH).forEach(k=>{if(+k>tot)delete SCH[k]})}   // Tisch hat Punkte zurückgenommen
  else if(tot===SC.t+1)put(tot);                                       // ein Punkt dazu
  else if(tot===SC.t&&(a!==SC.a||b!==SC.b))put(tot);                   // Punkt vom Tisch geändert (anderes Team)
  SCH[tot]=st;SC={set:set,t:tot,a:a,b:b};
}

// ---------- Eigene Zählung ----------
function replay(ev){
  let s={pts:[0,0,0],sets:[0,0,0],cur:1,hist:[],serve:0};
  for(const e of ev){
    if(e.pt==null)continue;   // Annahme ohne Punktgewinn
    s.pts[e.pt]++;s.serve=e.pt;
    const t=s.cur===5?15:25,a=s.pts[1],b=s.pts[2];
    if((a>=t||b>=t)&&Math.abs(a-b)>=2){
      s.hist.push(a+":"+b);s.sets[a>b?1:2]++;
      if(s.sets[1]<3&&s.sets[2]<3){s.cur++;s.pts=[0,0,0];}
    }
  }return s;
}
function commit(t){
  const q=sel[t];if(!q.skill)return;
  if(q.skill==="rec"&&!q.g)return;
  const s=replay(events),p=q.pl?playerInfo(q.pl):null,rec=q.skill==="rec",sv=rec?(q.srvP||playerInfo(srvUuid())||L.serving||{}):{};
  const ev={ts:Date.now(),set:s.cur,skill:q.skill,err:q.skill==="err"?(q.err||"other"):null,
    team:t,pt:rec?(q.g==="="?3-t:null):(q.skill==="err"?3-t:t),pl:p?p.uuid:null,num:p?p.num:null,name:p?p.name:null,grade:rec?q.g:null,
    srv:rec?(sv.uuid||null):null,srvNum:rec?(sv.num||null):null,srvName:rec?(sv.name||null):null};
  if(jref)jref.push(ev);else events.push(ev);
  flash={t,pl:ev.pl,txt:`${evTxt(ev)} · ${ev.num?"#"+ev.num+" "+short(ev.name):"ohne Spieler"}`};
  clearTimeout(ft);ft=setTimeout(()=>{flash=null;render()},1700);
  if(navigator.vibrate)navigator.vibrate(60);
  sel[t]={};save();
}
function undo(){if(jref&&keys.length)jref.child(keys[keys.length-1]).remove();else events.pop();save()}
function resetAll(){
  if(!confirm("Сбросить всё на 0?\nСтатистика этого матча будет удалена."))return;
  sel={1:{},2:{}};flash=null;
  if(jref)jref.remove();else events=[];
  if(sref)sref.remove();serves={};
  save();
}
(function(){const b=document.getElementById("undo");let t=null,held=false;
  const stop=()=>{clearTimeout(t);b.classList.remove("hold")};
  b.addEventListener("pointerdown",()=>{held=false;b.classList.add("hold");t=setTimeout(()=>{held=true;stop();resetAll()},1200)});
  ["pointerup","pointerleave","pointercancel"].forEach(e=>b.addEventListener(e,stop));
  b.addEventListener("click",()=>{if(held){held=false;return}undo()});
  b.addEventListener("contextmenu",e=>e.preventDefault());
})();
function swap(){topTeam=3-topTeam;render()}
function save(){render();pushVmix()}

// ---------- Spieler ----------
function team(t){return"team"+t}
function field(t){return(L.lineup[team(t)]||[]).slice(0,6)}
function benchList(t){
  const f=new Set(field(t).map(p=>p&&p.uuid)),out=[];
  (L.bench[team(t)]||[]).forEach(p=>{if(p&&!f.has(p.uuid))out.push(p)});
  const li=L.libero[team(t)];if(li&&!f.has(li.uuid)&&!out.find(p=>p.uuid===li.uuid))out.push(li);
  return out;
}
function playerInfo(u){for(const t of[1,2])for(const p of field(t).concat(benchList(t)))if(p&&p.uuid===u)return p;return null}
function teamOf(u){for(const t of[1,2])for(const p of field(t).concat(benchList(t)))if(p&&p.uuid===u)return t;return 0}
// ---------- Роль на поле (логика как в Aufstellung): по ротации от связующего ----------
const roleOrder=["Zuspieler","Aussenangriff","Mittelblock","Diagonal","Aussenangriff","Mittelblock"];
const ABBR={Zuspieler:"Z",Aussenangriff:"AA",Mittelblock:"MB",Diagonal:"D",Libero:"L"};
function isLib(p,t){const r=L.roster&&L.roster[team(t)],libs=(r&&r.liberos)||[];return libs.length?libs.some(l=>l.uuid===p.uuid):p.role==="Libero"}
function fieldRoles(t){
  const f=field(t);if(f.length!==6||f.some(p=>!p))return f.map(p=>p?(isLib(p,t)?"Libero":p.role||""):"");
  const zs=f.map((p,i)=>p.role==="Zuspieler"&&!isLib(p,t)?i:-1).filter(i=>i>=0),z=zs.length===1?zs[0]:-1;
  return f.map((p,i)=>isLib(p,t)?"Libero":z===-1?(p.role==="Libero"?"":p.role||""):roleOrder[(i-z+6)%6]);
}
const srvUuid=()=>L.serving&&L.serving.uuid;
function srvTeam(){return teamOf(srvUuid())}

// ---------- UI ----------
function arm(t,k){sel[3-t]={};let q=sel[t];
  if(q.skill===k){sel[t]={};render();return}
  if(q.auto&&k!=="ace"){q.pl=null;q.auto=false}
  q.skill=k;
  if(k==="err"){q.err="other";q.errSet=false}   // по умолчанию «Sonst.», errSet = тип выбран нажатием
  if(k==="rec"){q.g=null;q.srvP=playerInfo(srvUuid())||L.serving||null}   // Annahme: erst Note wählen; Aufschläger JETZT merken
  else q.srvP=null;
  if(k==="ace"&&!q.pl&&srvTeam()===t){q.pl=srvUuid();q.auto=true}
  if(k==="rec")return render();
  if(k!=="err"&&q.pl&&!q.auto)return commit(t);
  render()}
function pick(t,u){sel[3-t]={};const q=sel[t],same=q.pl===u&&!q.auto;
  q.pl=same?null:u;q.auto=false;
  if(q.pl&&q.skill&&(q.skill!=="err"||q.errSet)&&(q.skill!=="rec"||q.g))return commit(t);   // ошибка: сохраняем сразу, если тип уже выбран нажатием
  render()}
function setErr(t,k){const q=sel[t];q.err=k;q.errSet=true;if(q.pl)return commit(t);render()}   // игрок уже выбран — сохраняем сразу
function setGrade(t,g){const q=sel[t];q.g=g;if(q.pl)return commit(t);render()}   // Spieler schon gewählt — sofort speichern
function pEl(t,p,small,role){
  if(!p)return'<div class="pw"></div>';
  const q=sel[t],c=small?"":"";
  return`<div class="pw"><div class="p ${q.pl===p.uuid?"sel":""} ${p.uuid===srvUuid()?"srv":""} ${flash&&flash.pl===p.uuid&&flash.t===t?"ok":""}" style="background:${COL[t]}" onclick="pick(${t},'${p.uuid}')">${p.num}</div>${small?"":`<div class="nm">${(p.name||"").split(" ").slice(-1)[0]}${ABBR[role]?` | ${ABBR[role]}`:""}</div>`}</div>`;
}
function block(t){
  const f=field(t),rl=fieldRoles(t),g=i=>pEl(t,f[i],false,rl[i]),top=t===topTeam,row=a=>`<div class="row">${a.map(g).join("")}</div>`,front=row(top?[1,2,3]:[3,2,1]),back=row(top?[0,5,4]:[4,5,0]);
  const q=sel[t],b=benchList(t).map(p=>`<div class="p ${q.pl===p.uuid?"sel":""} ${flash&&flash.pl===p.uuid&&flash.t===t?"ok":""}" style="background:${COL[t]}" onclick="pick(${t},'${p.uuid}')">${p.num}</div>`).join("");
  const K3=srvTeam()===3-t?"rec":"ace",acts=["atk","blk",K3,"err"].map(k=>`<button class="${q.skill===k?"on":""}" onclick="arm(${t},'${k}')">${SK[k]}</button>`).join("");
  const sub=q.skill==="err"?`<div class="sub">${Object.keys(ERR).map(k=>`<button class="${q.err===k?"on":""}" onclick="setErr(${t},'${k}')">${ERR[k]}</button>`).join("")}</div>`
    :q.skill==="rec"?`<div class="sub">${GR.map(g=>`<button class="${q.g===g?"on":""}" onclick="setGrade(${t},'${g}')">${g}</button>`).join("")}</div>`:"";
  const first=t===topTeam;
  return`<div class="blk">${flash&&flash.t===t?`<div class="toast">✓ ${flash.txt}</div>`:""}<div class="rows"><div class="hd"><span style="color:${TXT[t]}">${L.names[t]||"Team "+t}</span><span>${stat(t)}</span></div>${first?back+front:front+back}</div>${sub||`<div class="bench">${b||'<span class="nm">Bank leer</span>'}</div>`}
  <div class="act">${acts}<button class="ok" ${q.skill&&(q.skill!=="rec"||q.g)?"":"disabled"} onclick="commit(${t})">OK</button></div></div>`;
}
function stat(t){const c=replay(events).cur,a=agg(events.filter(e=>e.set===c)).team[t];return`${a.atk+a.blk+a.ace} (A${a.atk} B${a.blk} S${a.ace}) F${a.err}`}
function render(){
  for(const t of[1,2]){const k=srvTeam()===3-t?"rec":"ace",q=sel[t];if(((q.skill==="rec"&&!q.srvP)||q.skill==="ace")&&q.skill!==k)sel[t]={}}   // Aufschlag gewechselt → Auswahl zurücksetzen
  const s=replay(events),o=topTeam,u=3-o;
  document.getElementById("app").innerHTML=block(o)+'<div class="net"></div>'+block(u);
  document.getElementById("pts").textContent=s.pts[1]+" : "+s.pts[2];
  document.getElementById("s1").textContent=s.sets[1];document.getElementById("s2").textContent=s.sets[2];
  const e=events[events.length-1];
  document.getElementById("log").textContent=e?`${evTxt(e)} · ${e.num?"#"+e.num+" "+e.name:"ohne Spieler"}`:"";
}

// ---------- Statistik -> vMix ----------
const rz=()=>({n:0,"#":0,"+":0,"!":0,"-":0,"/":0,"=":0});
function agg(evs,set){
  evs=evs||events;
  const z=()=>({atk:0,blk:0,ace:0,err:0,errs:0,r:rz(),sv:{n:0,g:{"#":0,"+":0,"!":0,"-":0,"/":0,"=":0}}});   // errs = Fehler beim Aufschlag (Teilmenge von err); r = Annahme; sv = Aufschläge
  const team={1:z(),2:z()},bySet={},pl={};
  const R=(o,g)=>{o.r.n++;o.r[g]++},S=(o,g)=>{o.sv.g[g===null?"=":SV_MAP[g]]++};   // sv.g = bewertete Aufschläge; sv.n (alle Aufschläge) kommt aus "serves"
  const P=(u,t,num,name)=>pl[u]||(pl[u]=Object.assign(z(),{uuid:u,team:t,num:num,name:name}));
  for(const e of evs){
    const b=bySet[e.set]=bySet[e.set]||{1:z(),2:z()};
    if(e.skill==="rec"){                       // Annahme: Note für Annehmer, Gegenstück für Aufschläger; "=" = Ass
      const rt=e.team,st=3-rt,g=e.grade;
      [team[rt],b[rt]].forEach(o=>R(o,g));
      [team[st],b[st]].forEach(o=>{S(o,g);if(g==="=")o.ace++});
      if(e.pl)R(P(e.pl,rt,e.num,e.name),g);
      if(e.srv){const p=P(e.srv,st,e.srvNum,e.srvName);S(p,g);if(g==="=")p.ace++}
      continue}
    const se=e.skill==="err"&&e.err==="serve",ow=3-e.team,pe=e.pl?P(e.pl,e.team,e.num,e.name):null;
    team[e.team][e.skill]++;if(se)team[e.team].errs++;
    b[e.team][e.skill]++;if(se)b[e.team].errs++;
    if(e.skill==="ace"){                       // Ass ohne Annehmer: zählt als "=" für das Gegnerteam
      [team[ow],b[ow]].forEach(o=>R(o,"="));[team[e.team],b[e.team]].forEach(o=>S(o,"="));if(pe)S(pe,"=")}
    if(se){[team[e.team],b[e.team]].forEach(o=>S(o,null));if(pe)S(pe,null)}
    if(pe){pe[e.skill]++;if(se)pe.errs++}
  }
  Object.values(serves||{}).forEach(x=>{if(!x||(set!=null&&x.set!==set))return;if(team[x.team])team[x.team].sv.n++;if(x.pl)P(x.pl,x.team,x.num,x.name).sv.n++});
  Object.values(pl).forEach(p=>p.pts=p.atk+p.blk+p.ace);
  return{team,bySet,pl};
}
const pc=(x,n)=>n?Math.round(100*x/n):"";
function fieldInfo(){                          // кто сейчас на поле и в какой роли (для титров)
  const o={};
  for(const t of[1,2]){const rl=fieldRoles(t);
    o["t"+t]=field(t).map((p,i)=>p?{uuid:p.uuid||"",num:String(p.num||""),name:p.name||"",short:short(p.name),role:ABBR[rl[i]]||""}:null).filter(Boolean)}
  return o}
function recFields(r,pre){                     // Annahme: Anzahl, Anteile in %, Index wie Data Volley
  pre=pre||"";const o={},n=r?r.n:0;o[pre+"r_n"]=n;
  [["perf","#"],["pos","+"],["ok","!"],["neg","-"],["bad","/"],["eq","="]].forEach(([k,g])=>{const c=r?r[g]:0;o[pre+"r_"+k]=c;o[pre+"r_"+k+"_p"]=pc(c,n)});
  o[pre+"r_good_p"]=r?pc(r["#"]+r["+"],n):"";
  o[pre+"r_idx"]=n?Math.round(10*GR.reduce((t,g)=>t+REC_W[g]*r[g],0)/n)/10:"";
  return o}
function svFields(x,pre){                      // Aufschlag: sv_n = alle Aufschläge (DVV), sv_r = bewertete; Index/Effizienz nur über bewertete
  pre=pre||"";const g=x?x.sv.g:null,r=g?Object.values(g).reduce((a,b)=>a+b,0):0,n=x?Math.max(x.sv.n,r):0,rn=g?r-g["="]:0;
  return{[pre+"sv_n"]:n,[pre+"sv_r"]:r,
    [pre+"sv_idx"]:r?Math.round(10*Object.keys(SV_W).reduce((t,k)=>t+SV_W[k]*g[k],0)/r)/10:"",
    [pre+"sv_eff_p"]:r?pc(g["#"]+g["+"]+g["!"]+g["/"],r):"",
    [pre+"sv_ace_p"]:pc(x?x.ace:0,n),[pre+"sv_err_p"]:pc(x?x.errs:0,n),[pre+"sv_good_p"]:r?pc(g["-"],rn):""}}
const short=n=>{if(!n)return"";const a=n.split(" ");return a.length>1?a[0][0]+". "+a.slice(1).join(" "):n};
let vt=null;function pushVmix(){clearTimeout(vt);vt=setTimeout(doVmix,300)}
function put(path,val){return fetch(`${VS}/${path}.json`,{method:"PUT",body:JSON.stringify(val)}).catch(()=>{})}
function teamBlock(o,evs,set){const B=agg(evs,set);for(const t of[1,2]){const T=B.team[t];o[`t${t}_pts`]=T.atk+T.blk+T.ace;["atk","blk","ace","err","errs"].forEach(k=>o[`t${t}_${k}`]=T[k]);Object.assign(o,recFields(T.r,`t${t}_`),svFields(T,`t${t}_`))}}
function doVmix(){
  const s=replay(events),n=s.hist.length;
  const cur={set:s.cur,pts1:s.pts[1],pts2:s.pts[2],sets1:s.sets[1],sets2:s.sets[2]};teamBlock(cur,events.filter(e=>e.set===s.cur),s.cur);
  const lp=(s.hist[n-1]||":").split(":"),last={set:n,pts1:lp[0],pts2:lp[1]};teamBlock(last,n?events.filter(e=>e.set===n):[],n);
  const pl={};
  for(const t of[1,2])Object.values((L.roster&&L.roster[team(t)])||{}).forEach(p=>{if(p&&p.uuid)pl[p.uuid]={uuid:p.uuid,team:t,teamName:L.names[t]||"",num:p.num||"",name:p.name||"",role:p.role||"",photo:p.photo||"",pts:0,atk:0,blk:0,ace:0,err:0,errs:0,...recFields(null),...svFields(null)}});
  Object.values(agg().pl).forEach(p=>{const q=pl[p.uuid]||(pl[p.uuid]={uuid:p.uuid,team:p.team,teamName:L.names[p.team]||"",num:p.num||"",name:p.name||"",role:(playerInfo(p.uuid)||{}).role||"",photo:(playerInfo(p.uuid)||{}).photo||""});
    Object.assign(q,{pts:p.pts,atk:p.atk,blk:p.blk,ace:p.ace,err:p.err,errs:p.errs,...recFields(p.r),...svFields(p)})});
  const all=Object.values(pl).filter(p=>p.pts>0).sort((a,b)=>b.pts-a.pts||b.atk-a.atk);
  put("stats_cur",[cur]);put("stats_last",[last]);put("stats_players",pl);put("stats_field",[fieldInfo()]);
  // подающий и серия очков подряд в текущем сэте (для страницы комментаторов)
  const cs=events.filter(e=>e.set===s.cur&&e.pt!=null);let run=0,rt=0;
  if(cs.length){rt=cs[cs.length-1].pt;for(let i=cs.length-1;i>=0&&cs[i].pt===rt;i--)run++}
  put("stats_serving",[{uuid:srvUuid()||"",team:srvTeam()||0,run:run,runTeam:rt}]);
  const F=["uuid","name","num","role","photo","teamName","pts","atk","blk","ace","err","errs"],flat=(o,pre,p)=>{F.forEach(k=>o[pre+k]=p?p[k]:"");o[pre+"short"]=p?short(p.name):"";o[pre+"team"]=p?p.team:""};
  const top5={},byT={all:all,t1:all.filter(p=>p.team===1),t2:all.filter(p=>p.team===2)};
  for(const g in byT)for(let i=0;i<5;i++)flat(top5,`${g}_${i+1}_`,byT[g][i]);
  const duel={};flat(duel,"t1_",byT.t1[0]);flat(duel,"t2_",byT.t2[0]);
  put("stats_top5",[top5]);put("stats_duel",[duel]);
}
render();
